<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sabor 21</title>

    <!-- Boostrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>

    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/productos.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <header class="header-app">

        <a href="index.html" class="logo-centro">
            <img src="img/logo.png" alt="Sabor 21">
        </a>

    </header>

    <main>

        <!-- Categorias-->
        <h1 style="color: #ff6b16;" class="titulo">Hamburguesas</h1>
        <p class="subtitulo">El antojo tiene nombre y sabor</p>

        <!-- CARRITO -->
        <div class="overlay" id="overlay"></div>

        <section id="carrito-panel">

            <div class="carrito-header">

                <h2>🛒 Mi carrito</h2>

                <button id="cerrar-carrito">
                    <img style="width: 35px;" src="img/x.png" alt="">
                </button>

            </div>


            <div id="lista-carrito">
                <!-- Productos del carrito -->
            </div>


            <div class="carrito-footer">

                <p id="total">
                    Total: 0 Gs.
                </p>

                <button onclick="irFormulario()" id="btn-pedir">
                    Terminar mi pedido
                </button>

            </div>

        </section>

        <div id="productos">

        </div>


        <!--Footer-->
        <footer class="footer-app">

            <a href="index.html" class="footer-item activo">
                <i class="fa-solid fa-house"></i>
                <span>Inicio</span>
            </a>

            <a href="#promociones" class="footer-item">
                <i class="fa-solid fa-location-dot"></i>
                <span>Ubicación</span>
            </a>

            <a href="#contacto" class="footer-item">
                <i class="fa-solid fa-phone"></i>
                <span>Contacto</span>
            </a>

            <button class="footer-item btn-carrito" id="btn-carrito" type="button">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>Carrito</span>
                <span class="footer-contador contador-carrito">0</span>
            </button>

        </footer>

        <!-- Alert boostrap -->
        <div class="toast-container position-fixed top-0 end-0 p-3">
            <div id="aviso-carrito" class="toast text-bg-success border-0" role="alert">
                <div class="d-flex">
                    <div class="toast-body" id="aviso-mensaje"></div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                        aria-label="Cerrar"></button>
                </div>
            </div>
        </div>


        <!-- JAVASCRIPT -->

        <script src="js/carrito.js"></script>
        <script src="js/productos.js"></script>
        <script src="js/categorias.js"></script>
        <script src="js/btn-hambur.js"></script>
        <script src="js/enlaces.js"></script>

</body>

</html>
